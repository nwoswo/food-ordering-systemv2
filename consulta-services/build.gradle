plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.palantir.docker'
}


ext {
    set('springCloudVersion', "2023.0.0")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // 🔁 Módulos internos compartidos
    implementation project(':common-libraries') // Librerías comunes del monorepo

    // 🌐 Web y validación
    implementation 'org.springframework.boot:spring-boot-starter-web' // Soporte para controladores REST y MVC
    implementation 'org.springframework.boot:spring-boot-starter-validation' // Validación con Bean Validation (JSR-380)

    // 🗃️ Persistencia y migraciones
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // Integración con JPA/Hibernate
    implementation 'org.flywaydb:flyway-core' // Migraciones de base de datos
    implementation 'org.postgresql:postgresql' // Driver JDBC para PostgreSQL

    // 🧪 Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // Framework de pruebas para Spring Boot
    testImplementation 'org.springframework.kafka:spring-kafka-test' // Utilidades para testear Kafka

    // 🧵 Kafka y mensajería
    implementation 'org.springframework.kafka:spring-kafka' // Integración con Apache Kafka

    // 🧠 MapStruct para mapeo entre DTOs y entidades
    implementation 'org.mapstruct:mapstruct:1.5.5.Final' // API de MapStruct
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final' // Procesador de anotaciones para generar mapeos

    // 🧰 Utilidades de desarrollo
    compileOnly 'org.projectlombok:lombok' // Anotaciones para reducir boilerplate (solo en compilación)
    annotationProcessor 'org.projectlombok:lombok' // Procesador de anotaciones de Lombok

    // 📊 Observabilidad y monitoreo
    implementation 'org.springframework.boot:spring-boot-starter-actuator' // Endpoints de salud, métricas, etc.

    // 📖 Documentación de API con OpenAPI/Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // 🧠 MapStruct para mapeo entre DTOs y entidades
    implementation 'org.mapstruct:mapstruct:1.5.5.Final' // API de MapStruct
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final' // Procesador de anotaciones para generar mapeos
     // Genera UI de Swagger y spec OpenAPI
}


bootJar {
    archiveBaseName = 'consulta-service'
    archiveVersion = '1.0.0'
}


docker {
    name "consulta-service:latest"
    dockerfile file('Dockerfile')
    files bootJar.archiveFile
    buildArgs([JAR_FILE: bootJar.archiveFileName.get()])
    copySpec.into('build/libs')
}
